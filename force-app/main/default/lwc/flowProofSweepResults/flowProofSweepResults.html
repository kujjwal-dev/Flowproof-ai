<template>
  <template lwc:if={displayed}>
    <lightning-card icon-name="utility:list">
      <h2 slot="title" class="sweep-title">{title}</h2>
      <div slot="actions">
        <template lwc:if={canSimulate}>
          <lightning-button
            label={whatIfButtonLabel}
            onclick={handleToggleWhatIf}
            class="what-if-toggle"
          ></lightning-button>
        </template>
      </div>
      <div class="slds-p-horizontal_medium">
        <template lwc:if={simulated}>
          <div
            class="slds-scoped-notification slds-theme_warning slds-m-bottom_small simulated-notice"
            role="status"
          >
            <p>
              <strong class="slds-m-right_xx-small"
                >Simulated values, nothing was saved:</strong
              >
              {simulatedText}
            </p>
            <lightning-button
              variant="base"
              label="Back to current values"
              onclick={handleShowCurrent}
              class="show-current"
            ></lightning-button>
          </div>
        </template>

        <p class="slds-m-bottom_small sweep-summary">{summaryText}</p>

        <template lwc:if={showWhatIf}>
          <div class="slds-box slds-m-bottom_small what-if-form">
            <p class="slds-text-title_bold slds-m-bottom_x-small">
              What if the record had these values?
            </p>
            <div class="slds-grid slds-wrap slds-gutters_small">
              <template for:each={whatIfInputs} for:item="field">
                <div
                  key={field.apiName}
                  class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-m-bottom_x-small"
                >
                  <template lwc:if={field.isPicklist}>
                    <lightning-combobox
                      label={field.label}
                      options={field.choices}
                      value={field.draft}
                      data-field={field.apiName}
                      onchange={handleWhatIfChange}
                    ></lightning-combobox>
                  </template>
                  <template lwc:elseif={field.isCheckbox}>
                    <lightning-input
                      type="checkbox"
                      label={field.label}
                      checked={field.checked}
                      data-field={field.apiName}
                      onchange={handleWhatIfChange}
                    ></lightning-input>
                  </template>
                  <template lwc:else>
                    <lightning-input
                      type={field.inputType}
                      step="any"
                      label={field.label}
                      value={field.draft}
                      data-field={field.apiName}
                      onchange={handleWhatIfChange}
                    ></lightning-input>
                  </template>
                </div>
              </template>
            </div>
            <template lwc:if={whatIfError}>
              <p
                class="slds-text-color_error slds-m-bottom_x-small what-if-error"
              >
                {whatIfError}
              </p>
            </template>
            <lightning-button
              variant="brand"
              label="Check with these values"
              onclick={handleSimulate}
              disabled={running}
              class="simulate-button"
            ></lightning-button>
          </div>
        </template>

        <p
          class="slds-text-body_small slds-text-color_weak slds-m-bottom_small execution-notice"
        >
          {noticeText}
        </p>

        <template lwc:if={hasSkipped}>
          <p class="slds-m-bottom_small slds-text-color_weak skipped-notice">
            {skippedText}
          </p>
        </template>

        <template lwc:if={runError}>
          <div
            class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_small run-error"
            role="alert"
          >
            <span class="slds-assistive-text">Error</span>
            <h2>{runError}</h2>
          </div>
        </template>

        <template lwc:if={hasRows}>
          <div class="slds-scrollable_x">
            <table
              class="slds-table slds-table_bordered slds-table_cell-buffer sweep-table"
              aria-label="Record-triggered Flows checked against the record"
            >
              <thead>
                <tr class="slds-line-height_reset">
                  <th scope="col"><div class="slds-truncate">Flow</div></th>
                  <th scope="col">
                    <div class="slds-truncate">Entry conditions</div>
                  </th>
                  <th scope="col">
                    <div class="slds-truncate">What FlowProof found</div>
                  </th>
                  <th scope="col">
                    <div class="slds-truncate">Flow health</div>
                  </th>
                  <template lwc:if={canInvestigate}>
                    <th scope="col">
                      <div class="slds-assistive-text">Actions</div>
                    </th>
                  </template>
                </tr>
              </thead>
              <tbody>
                <template for:each={rows} for:item="row">
                  <tr key={row.flowApiName} class="sweep-row">
                    <th scope="row" class="slds-cell-wrap">
                      <div class="slds-text-title_bold">{row.flowLabel}</div>
                      <div class="slds-text-body_small slds-text-color_weak">
                        {row.triggerText}
                      </div>
                      <template lwc:if={row.inactive}>
                        <lightning-badge
                          label="Inactive"
                          class="slds-badge_lightest slds-m-top_xx-small"
                        ></lightning-badge>
                      </template>
                    </th>
                    <td>
                      <lightning-badge
                        label={row.overall.label}
                        class={row.overall.badgeClass}
                        data-id="overall"
                      ></lightning-badge>
                    </td>
                    <td class="slds-cell-wrap">
                      <template lwc:if={row.topFinding}>
                        <div class="top-finding">{row.topFinding.title}</div>
                      </template>
                      <template for:each={row.conditions} for:item="condition">
                        <div
                          key={condition.key}
                          class="slds-text-body_small slds-text-color_weak unmatched-condition"
                        >
                          {condition.text}
                        </div>
                      </template>
                    </td>
                    <td class="slds-cell-wrap health-cell">
                      <span title={row.healthTitle}>{row.healthText}</span>
                    </td>
                    <template lwc:if={canInvestigate}>
                      <td>
                        <lightning-button
                          label="Investigate"
                          data-flow={row.flowApiName}
                          onclick={handleInvestigate}
                          disabled={running}
                          class="investigate-row"
                        ></lightning-button>
                      </td>
                    </template>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </template>
        <template lwc:else>
          <p class="slds-text-color_weak no-flows">
            This object has no record-triggered Flows that you can see.
          </p>
        </template>

        <template lwc:if={running}>
          <lightning-spinner
            alternative-text="Working"
            size="small"
          ></lightning-spinner>
        </template>
      </div>
    </lightning-card>
  </template>
</template>
