<template>
  <template lwc:if={result}>
    <lightning-card icon-name="utility:metrics">
      <h2 slot="title" class="results-title">{title}</h2>
      <div slot="actions">
        <lightning-button-group>
          <template lwc:if={canExplain}>
            <lightning-button
              label="AI explanation"
              onclick={handleExplain}
              class="explain-button"
            ></lightning-button>
          </template>
          <lightning-button
            label="Open record"
            onclick={handleOpenRecord}
            class="open-record"
          ></lightning-button>
        </lightning-button-group>
      </div>

      <div class="slds-p-horizontal_medium">
        <div class="slds-grid slds-wrap slds-gutters_small slds-m-bottom_small">
          <div class="slds-col">
            <lightning-badge
              label={overall.label}
              class={overall.badgeClass}
              data-id="overall"
            ></lightning-badge>
          </div>
          <div
            class="slds-col slds-text-body_small slds-text-color_weak slds-text-align_right"
          >
            {result.objectApiName}: {recordLabel}
            <template lwc:if={result.investigatedAt}>
              &nbsp;·&nbsp;
              <lightning-formatted-date-time
                value={result.investigatedAt}
                year="numeric"
                month="short"
                day="2-digit"
                hour="2-digit"
                minute="2-digit"
              ></lightning-formatted-date-time>
            </template>
          </div>
        </div>

        <template lwc:if={result.expectedOutcome}>
          <p class="slds-m-bottom_small expected-outcome">
            <strong class="slds-m-right_xx-small">Expected outcome:</strong>
            {result.expectedOutcome}
          </p>
        </template>

        <p
          class="slds-text-body_small slds-text-color_weak slds-m-bottom_medium execution-notice"
        >
          Based on the Flow's current setup and the record's current values.
          Salesforce keeps no history of past Flow runs, so whether this Flow
          ran is not confirmed.
        </p>

        <h3 class="slds-text-heading_small slds-m-bottom_x-small">
          Findings ({findingCount})
        </h3>
        <div class="slds-m-bottom_medium">
          <c-flow-proof-finding-list
            findings={displayedFindings}
            data-id="findings"
            empty-text="No findings."
          ></c-flow-proof-finding-list>
        </div>

        <c-flow-proof-ai-explanation
          investigation-id={result.investigationId}
          explanation={result.aiExplanation}
        ></c-flow-proof-ai-explanation>

        <h3 class="slds-text-heading_small slds-m-bottom_x-small">
          Entry conditions
        </h3>
        <template lwc:if={hasConditions}>
          <p class="slds-m-bottom_x-small overall-reason">{overallReason}</p>
          <div class="slds-scrollable_x slds-m-bottom_medium">
            <table
              class="slds-table slds-table_bordered slds-table_cell-buffer conditions-table"
              aria-label="Entry condition results"
            >
              <thead>
                <tr class="slds-line-height_reset">
                  <th scope="col"><div class="slds-truncate">#</div></th>
                  <th scope="col"><div class="slds-truncate">Field</div></th>
                  <th scope="col"><div class="slds-truncate">Operator</div></th>
                  <th scope="col"><div class="slds-truncate">Expected</div></th>
                  <th scope="col">
                    <div class="slds-truncate">Current value</div>
                  </th>
                  <th scope="col"><div class="slds-truncate">Result</div></th>
                </tr>
              </thead>
              <tbody>
                <template for:each={conditions} for:item="condition">
                  <tr key={condition.key} class="condition-row">
                    <th scope="row">{condition.index}</th>
                    <td>{condition.field}</td>
                    <td>{condition.operatorText}</td>
                    <td>{condition.expectedDisplay}</td>
                    <td>{condition.actualText}</td>
                    <td class="slds-cell-wrap">
                      <lightning-badge
                        label={condition.outcomeInfo.label}
                        class={condition.outcomeInfo.badgeClass}
                      ></lightning-badge>
                      <template lwc:if={condition.note}>
                        <div
                          class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small condition-note"
                        >
                          {condition.note}
                        </div>
                      </template>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </template>
        <template lwc:else>
          <p class="slds-m-bottom_medium no-conditions">{noConditionsText}</p>
        </template>

        <h3 class="slds-text-heading_small slds-m-bottom_x-small">
          Flow health ({healthCount})
        </h3>
        <div class="slds-m-bottom_medium">
          <c-flow-proof-finding-list
            findings={healthFindings}
            data-id="health"
            empty-text={healthEmptyText}
            next-step-label="Suggestion:"
          ></c-flow-proof-finding-list>
        </div>

        <h3 class="slds-text-heading_small slds-m-bottom_x-small">Flow</h3>
        <dl
          class="slds-list_horizontal slds-wrap slds-m-bottom_medium flow-details"
        >
          <dt class="slds-item_label slds-text-color_weak">Flow</dt>
          <dd class="slds-item_detail">{flowLabel}</dd>
          <dt class="slds-item_label slds-text-color_weak">Status</dt>
          <dd class="slds-item_detail">{flowStatus}</dd>
          <dt class="slds-item_label slds-text-color_weak">Runs</dt>
          <dd class="slds-item_detail">{triggerText}</dd>
          <dt class="slds-item_label slds-text-color_weak">Trigger object</dt>
          <dd class="slds-item_detail">{triggerObjectText}</dd>
          <dt class="slds-item_label slds-text-color_weak">
            Only when updated to meet conditions
          </dt>
          <dd class="slds-item_detail">{onlyWhenUpdatedText}</dd>
        </dl>
      </div>
    </lightning-card>
  </template>
</template>
