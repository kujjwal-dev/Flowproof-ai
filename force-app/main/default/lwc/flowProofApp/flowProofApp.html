<template>
  <section class="hero slds-m-bottom_medium" aria-label="About FlowProof AI">
    <svg
      class="hero-art"
      viewBox="0 0 480 200"
      aria-hidden="true"
      focusable="false"
    >
      <g
        fill="none"
        stroke="#ffffff"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <rect x="20" y="80" width="90" height="40" rx="20"></rect>
        <path d="M110 100 H170"></path>
        <path d="M200 70 L230 100 L200 130 L170 100 Z"></path>
        <path d="M230 100 H270 V50 H310"></path>
        <path d="M270 100 V150 H310"></path>
        <rect x="310" y="30" width="100" height="40" rx="8"></rect>
        <rect x="310" y="130" width="100" height="40" rx="8"></rect>
        <path d="M410 50 H436"></path>
        <circle cx="452" cy="50" r="16"></circle>
        <path d="M444 50 L450 56 L461 44"></path>
      </g>
    </svg>
    <div class="hero-content">
      <img class="hero-logo" src={logoUrl} alt="FlowProof AI logo" />
      <div>
        <p class="hero-eyebrow">Flow troubleshooting, with evidence</p>
        <h1 class="hero-title">Why didn't my Flow run?</h1>
        <p class="hero-subtitle">
          Pick a record. FlowProof checks your record-triggered Flows against
          it, labels every conclusion with its evidence, and suggests what to
          fix. It is read-only: it never changes your data or your Flows.
        </p>
        <ul class="hero-chips">
          <template for:each={highlights} for:item="highlight">
            <li key={highlight.label} class="hero-chip">
              <lightning-icon
                icon-name={highlight.icon}
                size="xx-small"
                variant="inverse"
                alternative-text=""
              ></lightning-icon>
              <span>{highlight.label}</span>
            </li>
          </template>
        </ul>
      </div>
    </div>
  </section>

  <lightning-tabset active-tab-value={activeTab}>
    <lightning-tab
      label="New investigation"
      value="investigate"
      onactive={handleTabActive}
    >
      <c-flow-proof-new-investigation
        oninvestigationcomplete={handleInvestigationComplete}
        onsweepcomplete={handleSweepComplete}
      ></c-flow-proof-new-investigation>
      <template lwc:if={latestSweep}>
        <div class="slds-m-top_medium latest-sweep">
          <c-flow-proof-sweep-results
            sweep={latestSweep}
            oninvestigationcomplete={handleSweepInvestigation}
          ></c-flow-proof-sweep-results>
        </div>
      </template>
      <template lwc:if={latestResult}>
        <div class="slds-m-top_medium latest-result">
          <c-flow-proof-results result={latestResult}></c-flow-proof-results>
        </div>
      </template>
    </lightning-tab>

    <lightning-tab label="History" value="history" onactive={handleTabActive}>
      <template lwc:if={viewedResult}>
        <lightning-button
          label="Back to history"
          icon-name="utility:back"
          onclick={handleBackToHistory}
          class="slds-m-bottom_small back-button"
        ></lightning-button>
        <c-flow-proof-results result={viewedResult}></c-flow-proof-results>
      </template>
      <template lwc:else>
        <template lwc:if={viewLoading}>
          <lightning-spinner
            alternative-text="Loading investigation"
            size="small"
          ></lightning-spinner>
        </template>
        <template lwc:if={viewError}>
          <div
            class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_small view-error"
            role="alert"
          >
            <span class="slds-assistive-text">Error</span>
            <h2>{viewError}</h2>
          </div>
        </template>
        <c-flow-proof-history
          onviewinvestigation={handleViewInvestigation}
        ></c-flow-proof-history>
      </template>
    </lightning-tab>

    <lightning-tab label="Settings" value="settings" onactive={handleTabActive}>
      <c-flow-proof-settings></c-flow-proof-settings>
    </lightning-tab>
  </lightning-tabset>
</template>
