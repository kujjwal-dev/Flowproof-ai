<template>
  <template lwc:if={hasFindings}>
    <ul class="slds-has-dividers_around-space findings">
      <template for:each={items} for:item="finding">
        <li key={finding.key} class="slds-item finding">
          <div class="slds-media">
            <div class="slds-media__figure">
              <lightning-icon
                icon-name={finding.severity.iconName}
                variant={finding.severity.iconVariant}
                size="small"
                alternative-text={finding.severityText}
              ></lightning-icon>
            </div>
            <div class="slds-media__body">
              <div class="slds-grid slds-wrap slds-grid_vertical-align-center">
                <h4
                  class="slds-text-heading_small slds-m-right_small finding-title"
                >
                  {finding.title}
                </h4>
                <lightning-badge
                  label={finding.categoryInfo.label}
                  class={finding.categoryInfo.badgeClass}
                ></lightning-badge>
              </div>
              <p class="slds-m-top_xx-small finding-detail">{finding.detail}</p>
              <p class="slds-m-top_xx-small finding-next-step">
                <strong class="slds-m-right_xx-small">{nextStepLabel}</strong>
                {finding.recommendation}
              </p>
            </div>
          </div>
        </li>
      </template>
    </ul>
  </template>
  <template lwc:else>
    <p class="slds-text-color_weak empty-text">{emptyText}</p>
  </template>
</template>
